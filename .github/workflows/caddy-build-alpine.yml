name: Build Custom Caddy (alpine/musl)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy (upstream master, musl)
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
          CC: musl-gcc
        run: |
          xcaddy build master \
            --with github.com/caddy-dns/porkbun \
            --with github.com/caddyserver/replace-response
          mv caddy caddy-alpine

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-alpine
          path: caddy-alpine

      - name: Generate release tag
        run: echo "release_tag=release-$(date '+%Y-%m-%d-%H%M%S')" >> $GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          files: caddy-alpine
          body: |
            Custom Caddy build (alpine/musl)
            - Base: caddyserver/caddy@master
            - Plugins: caddy-dns/porkbun, replace-response
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
